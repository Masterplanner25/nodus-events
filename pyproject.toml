[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-events"
version = "0.1.0"
description = "Distributed event bus with Redis pub/sub, source-instance dedup, and pre-rehydration buffering"
authors = [{ name = "Shawn Knight" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.0.0"]
dev   = ["pytest>=8.0", "fakeredis>=2.0.0", "redis>=4.0.0"]

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-events"
Repository = "https://github.com/Masterplanner25/nodus-events"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_events*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
